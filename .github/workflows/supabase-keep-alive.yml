# Keeps the free-tier Supabase project from being paused for inactivity
# (Supabase pauses free projects after ~7 days without activity).
# Runs every 3 days and makes a tiny read against the public `campuses` table.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       – same value as VITE_SUPABASE_URL
#   SUPABASE_ANON_KEY  – same value as VITE_SUPABASE_ANON_KEY

name: Supabase keep-alive

on:
  schedule:
    - cron: "0 9 */3 * *" # 09:00 UTC on every 3rd day of the month
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/campuses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "HTTP $status"
          if [ "$status" -ne 200 ]; then
            cat response.json
            echo "::error::Supabase keep-alive request failed"
            exit 1
          fi
          echo "Supabase is awake."
